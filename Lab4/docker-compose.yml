version: "3.9"

services:

  mongo:

    image: mongo:7

    container_name: mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  attendance-app:

    build: .

    container_name: attendance-app

    restart: always

    ports:
      - "5000:5000"

    depends_on:
      - mongo

    environment:
      - MONGO_URI=mongodb://mongo:27017

volumes:

  mongo_data: