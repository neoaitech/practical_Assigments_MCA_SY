services:

  app:
    build: .
    container_name: college-event-app

    ports:
      - "3000:3000"

    environment:
      MONGO_URL: mongodb://mongo:27017/college_events

    depends_on:
      - mongo

  mongo:
    image: mongo:7

    container_name: college-event-mongodb

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
