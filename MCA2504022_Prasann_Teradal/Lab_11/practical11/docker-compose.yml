version: "3.9"
 
services:
  web:
    build: ./web
    expose:
      - "5000"
    depends_on:
      - redis
    networks:
      - appnet
 
  redis:
    image: redis:alpine
    networks:
      - appnet
 
  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - appnet
 
networks:
  appnet:
    driver: bridge
