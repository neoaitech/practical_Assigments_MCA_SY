<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teacher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h3>Edit Teacher</h3>

            </div>

            <div class="card-body">

                <form action="/update_teacher/{{ teacher._id }}" method="POST">

                    <div class="mb-3">

                        <label>Name</label>

                        <input type="text" name="name" class="form-control" value="{{ teacher.name }}" required>

                    </div>

                    <div class="mb-3">

                        <label>Department</label>

                        <input type="text" name="department" class="form-control" value="{{ teacher.department }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>Subject</label>

                        <input type="text" name="subject" class="form-control" value="{{ teacher.subject }}" required>

                    </div>

                    <div class="mb-3">

                        <label>Username</label>

                        <input type="text" name="username" class="form-control" value="{{ teacher.username }}" required>

                    </div>

                    <div class="mb-3">

                        <label>New Password</label>

                        <input type="password" name="password" class="form-control"
                            placeholder="Leave blank if no change">

                    </div>

                    <button class="btn btn-success">

                        Update Teacher

                    </button>

                    <a href="/teachers" class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>
</body>

</html>
