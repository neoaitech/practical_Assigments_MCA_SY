<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>
    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h3>Edit Student</h3>

            </div>

            <div class="card-body">

                <form action="/update_student/{{ student._id }}" method="POST">

                    <div class="mb-3">

                        <label>Name</label>

                        <input type="text" class="form-control" name="name" value="{{ student.name }}" required>

                    </div>

                    <div class="mb-3">

                        <label>Roll Number</label>

                        <input type="text" class="form-control" name="roll" value="{{ student.roll }}" required>

                    </div>

                    <div class="mb-3">

                        <label>Course</label>

                        <input type="text" class="form-control" name="course" value="{{ student.course }}" required>

                    </div>

                    <div class="mb-3">

                        <label>Username</label>

                        <input type="text" class="form-control" name="username" value="{{ student.username }}" required>

                    </div>

                    <div class="mb-3">

                        <label>New Password</label>

                        <input type="password" class="form-control" name="password"
                            placeholder="Leave blank if no change">

                    </div>

                    <button class="btn btn-success">

                        Update Student

                    </button>

                    <a href="/students" class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>
</body>

</html>
