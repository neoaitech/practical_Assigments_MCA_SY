apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-cloud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-cloud-app
  template:
    metadata:
      labels:
        app: hello-cloud-app
    spec:
      containers:
        - name: hello-cloud-app
          image: hello-cloud-app:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-cloud-app
spec:
  selector:
    app: hello-cloud-app
  type: NodePort
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080