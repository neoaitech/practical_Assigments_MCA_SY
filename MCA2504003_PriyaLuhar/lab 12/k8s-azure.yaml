apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-cloud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-cloud-app
  template:
    metadata:
      labels:
        app: hello-cloud-app
    spec:
      containers:
        - name: hello-cloud-app
          image: hellocloudacr20260924.azurecr.io/hello-cloud-app:v2
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-cloud-app
spec:
  type: LoadBalancer
  selector:
    app: hello-cloud-app
  ports:
    - port: 80
      targetPort: 5000