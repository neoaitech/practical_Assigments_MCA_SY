services:
  app:
    build: .
    container_name: college_event_app
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: college_event_mongodb
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
