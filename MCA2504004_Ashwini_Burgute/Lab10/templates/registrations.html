<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrations | CampusConnect</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="list-page">
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="fw-bold">Registered Students</h1>
      <p class="text-secondary">Live data read from MongoDB</p>
    </div>
    <a href="/" class="btn btn-primary rounded-pill px-4">← Register</a>
  </div>
  <div class="table-responsive shadow-sm rounded-4 bg-white">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>College</th><th>Course</th><th>Year</th><th>Event</th></tr></thead>
      <tbody>
      {% for r in registrations %}
        <tr>
          <td>{{ r.full_name }}</td><td>{{ r.email }}</td><td>{{ r.phone }}</td>
          <td>{{ r.college }}</td><td>{{ r.course }}</td><td>{{ r.year }}</td><td>{{ r.event }}</td>
        </tr>
      {% else %}
        <tr><td colspan="7" class="text-center py-5">No registrations yet.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
