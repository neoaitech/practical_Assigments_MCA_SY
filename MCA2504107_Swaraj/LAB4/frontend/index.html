<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Attendance Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="login-container">

    <div class="left-panel">

        <h1>ONLINE ATTENDANCE</h1>
        <h2>MANAGEMENT SYSTEM</h2>

        <p>
            Welcome to the College Attendance Management System.
            Manage attendance efficiently using Admin, Teacher and Student modules.
        </p>

        <img src="images/attendance.png" alt="Attendance">

    </div>


    <div class="right-panel">

        <div class="login-box">

            <h2>Login</h2>

            <form id="loginForm">

                <div class="input-box">
                    <i class="fa fa-user"></i>
                    <input
                        type="text"
                        id="username"
                        placeholder="Username"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>
                </div>

                <div class="input-box">

                    <select id="role" required>

                        <option value="">Select Role</option>

                        <option value="admin">Admin</option>

                        <option value="teacher">Teacher</option>

                        <option value="student">Student</option>

                    </select>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="info">

                <h3>Demo Login</h3>

                <p><b>Admin</b> : admin / admin123</p>

                <p><b>Teacher</b> : teacher / teacher123</p>

                <p><b>Student</b> : student / student123</p>

            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
