version: "3.8"

services:

  mongodb:
    image: mongo:7
    container_name: attendance-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: attendance-backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/attendanceDB

volumes:
  mongo-data: