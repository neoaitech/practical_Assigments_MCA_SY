<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet"
href="{{ url_for('static',filename='css/dashboard.css') }}">
</head>
<body>
<div class="sidebar">

<div class="logo">

Attendance System

</div>

<ul>

<li>

<a href="/admin">

<i class="bi bi-speedometer2"></i>

Dashboard

</a>

</li>

<li>

<a href="/students">

<i class="bi bi-people-fill"></i>

Students

</a>

</li>

<li>

<a href="/teachers">

<i class="bi bi-person-workspace"></i>

Teachers

</a>

</li>

<li>

<a href="/logout">

<i class="bi bi-box-arrow-right"></i>

Logout

</a>

</li>

</ul>

</div>

<div class="main">

<div class="topbar">

<h3>

Welcome Admin

</h3>

<div>

Administrator

</div>

</div>

<div class="cards">

<div class="card">

<i class="bi bi-mortarboard-fill fs-1 text-primary"></i>

<h2>{{ total_students }}</h2>

<p>Total Students</p>

</div>

<div class="card">

<i class="bi bi-person-video3 fs-1 text-success"></i>

<h2>{{ total_teachers }}</h2>

<p>Total Teachers</p>

</div>

<div class="card">

<i class="bi bi-calendar-check-fill fs-1 text-warning"></i>

<h2>{{ total_attendance }}</h2>

<p>Attendance Records</p>

</div>

<div class="card">

<i class="bi bi-envelope-paper-fill fs-1 text-danger"></i>

<h2>{{ total_leaves }}</h2>

<p>Leave Requests</p>

</div>

</div>

</div>
    
</body>
</html>
