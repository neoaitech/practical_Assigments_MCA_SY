<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Event Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>College Event Registration</h1>
    <p class="subtitle">Register for your college event</p>

    <form id="registrationForm">
      <label>Full Name</label>
      <input id="name" type="text" required>

      <label>Email</label>
      <input id="email" type="email" required>

      <label>Phone</label>
      <input id="phone" type="tel" required>

      <label>College</label>
      <input id="college" type="text" required>

      <label>Event</label>
      <select id="event" required>
        <option value="">Select Event</option>
        <option>Technical Fest</option>
        <option>Cultural Fest</option>
        <option>Sports Day</option>
        <option>Hackathon</option>
        <option>Workshop</option>
      </select>

      <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <hr>

    <h2>Registered Participants</h2>
    <button id="refreshBtn" type="button">View Registrations</button>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>College</th>
            <th>Event</th>
          </tr>
        </thead>
        <tbody id="registrationTable"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
