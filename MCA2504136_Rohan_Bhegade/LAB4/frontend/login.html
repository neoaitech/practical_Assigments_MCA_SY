<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Attendance Management System</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="left">

            <h1>Attendance Management System</h1>

            <p>Welcome Back! Please login to continue.</p>

            <img src="images/login.png" alt="Login Illustration">

        </div>

        <div class="right">

            <h2>Login</h2>

            <form id="loginForm">

                <div class="input-box">
                    <label>Select Role</label>
                    <select id="role">
                        <option value="admin">Admin</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter Email" required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" id="password" placeholder="Enter Password" required>
                        <i class="fa-solid fa-eye" id="togglePassword"></i>
                    </div>
                </div>

                <div class="options">
                    <label><input type="checkbox" id="remember"> Remember Me</label>
                    <a href="#">Forgot Password?</a>
                </div>

               <input type="submit" value="Login">

            </form>

            <p class="home">Don't have an account? <a href="register.html">Register</a></p>
            <p class="home"><a href="index.html">← Back to Home</a></p>

        </div>

    </div>

</div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>

</body>

</html>
