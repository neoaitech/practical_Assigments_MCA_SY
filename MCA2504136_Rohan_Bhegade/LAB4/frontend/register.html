<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Attendance Management System</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="left">

                <h1>Attendance Management System</h1>

                <p>Create your account to start using the system and manage attendance easily.</p>

                <img src="images/login.png" alt="Register Illustration">

            </div>

            <div class="right">

                <h2>Register</h2>

                <form id="registerForm">

                    <div class="input-box">
                        <label>Name</label>
                        <input type="text" id="name" placeholder="Enter Name" required>
                    </div>

                    <div class="input-box">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter Email" required>
                    </div>

                    <div class="input-box">
                        <label>Password</label>
                        <div class="password-box">
                            <input type="password" id="password" placeholder="Enter Password" required>
                            <i class="fa-solid fa-eye" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="input-box">
                        <label>Role</label>
                        <select id="role" required>
                            <option value="admin">Admin</option>
                            <option value="teacher">Teacher</option>
                            <option value="student" selected>Student</option>
                        </select>
                    </div>

                    <button type="submit" class="btn">Register</button>

                </form>

                <p class="home">Already have an account? <a href="login.html">Login</a></p>

            </div>

        </div>

    </div>

    <script src="js/common.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
