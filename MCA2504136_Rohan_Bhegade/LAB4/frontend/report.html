<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reports | Attendance Management System</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/report.js"></script>
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-chart-column"></i>

            <h2>Reports</h2>

        </div>

        <ul>

            <li>
                <a href="admin.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="attendance.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Attendance
                </a>
            </li>

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-chart-pie"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header>

            <h1>Attendance Reports</h1>

            <div class="profile">

                <i class="fa-solid fa-user-circle"></i>

                <span>Administrator</span>

            </div>

        </header>

        <!-- Statistics -->

        <section class="cards">

            <div class="card">

                <i class="fa-solid fa-users"></i>

                <h2 id="cardTotalStudents">0</h2>

                <p>Total Students</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-user-check"></i>

                <h2 id="cardPresentToday">0</h2>

                <p>Present Today</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-user-xmark"></i>

                <h2 id="cardAbsentToday">0</h2>

                <p>Absent Today</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-percent"></i>

                <h2 id="cardAttendanceRate">0%</h2>

                <p>Attendance Rate</p>

            </div>

        </section>

        <!-- Charts -->

        <section class="chart-section">

            <h2>Monthly Attendance Analysis</h2>

            <canvas id="attendanceChart"></canvas>

        </section>

        <!-- Report Table -->

        <section class="table-section">

            <h2>Student Attendance Report</h2>

            <table>

                <thead>

                    <tr>

                        <th>Roll No</th>
                        <th>Student Name</th>
                        <th>Total Classes</th>
                        <th>Present</th>
                        <th>Absent</th>
                        <th>Attendance %</th>

                    </tr>

                </thead>

                <tbody id="reportTable">

                </tbody>

            </table>

        </section>

        <br>

        <!-- Action Buttons -->

        <div class="report-buttons">

            <button class="save-btn" id="downloadPdfBtn">

                <i class="fa-solid fa-download"></i>

                Download PDF

            </button>

            <button class="save-btn" id="exportExcelBtn">

                <i class="fa-solid fa-file-excel"></i>

                Export Excel

            </button>

            <button class="save-btn" id="printReportBtn">

                <i class="fa-solid fa-print"></i>

                Print Report

            </button>

        </div>

    </main>

</div>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/report.js"></script>

</body>
</html>
