<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="sidebar">

    <h2>Student Panel</h2>

    <a href="student.html" class="active">Dashboard</a>
    <a href="report.html">Attendance Report</a>
    <a href="#" onclick="logout()">Logout</a>

</div>

<div class="main">

    <h1>Welcome Student</h1>

    <div class="cards">

        <div class="card summary-card">
            <h2 id="presentCount">0</h2>
            <p>Present</p>
        </div>

        <div class="card summary-card">
            <h2 id="absentCount">0</h2>
            <p>Absent</p>
        </div>

        <div class="card summary-card">
            <h2 id="attendancePercent">0%</h2>
            <p>Attendance</p>
        </div>

    </div>

    <div class="card">

        <h2>Attendance History</h2>

        <table id="attendanceTable">

            <thead>

            <tr>

                <th>Date</th>
                <th>Subject</th>
                <th>Status</th>

            </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<script src="js/common.js"></script>
<script src="js/student.js"></script>

</body>
</html>
