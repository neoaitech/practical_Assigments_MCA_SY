<!DOCTYPE html>
<html>
<head>
    <title>College Event Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: #333;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 College Event Registration</h1>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Phone</label>
        <input type="text" name="phone" required>

        <label>College</label>
        <input type="text" name="college" required>

        <label>Event</label>
        <select name="event" required>
            <option value="">Select Event</option>
            <option value="Tech Fest">Tech Fest</option>
            <option value="Hackathon">Hackathon</option>
            <option value="Cultural Fest">Cultural Fest</option>
            <option value="Sports Event">Sports Event</option>
        </select>

        <button type="submit">
            Register
        </button>

    </form>


    <h2>Registered Participants</h2>

    <table>

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>College</th>
            <th>Event</th>
        </tr>

        {% for user in registrations %}

        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.phone }}</td>
            <td>{{ user.college }}</td>
            <td>{{ user.event }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
